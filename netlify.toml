# Collective Horizon. Static site: no build step, no build section.
# Netlify rejects publish = "." (publish dir must differ from base dir),
# so the publish directory stays unset and defaults correctly.

# Media never changes without changing filename: cache hard for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers, site wide.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
