name: Fetch generated assets

on:
  workflow_dispatch:
  push:
    branches:
      - claude/collective-horizon-website-dzvdq3
    paths:
      - assets-manifest.json
      - scripts/fetch-assets.sh
      - scripts/extract-frames.sh
      - .github/workflows/fetch-assets.yml

permissions:
  contents: write

concurrency:
  group: fetch-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg webp jq

      - name: Fetch and process assets
        run: bash scripts/fetch-assets.sh

      - name: Commit processed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "no asset changes"
          else
            git commit -m "Add processed media assets"
            git push
          fi
